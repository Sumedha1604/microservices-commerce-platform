name: Docker build validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - product-service
          - inventory-service
          - cart-service
          - order-service
          - payment-service
          - checkout-service
          - notification-service
          - search-service
          - recommendation-service
          - frontend
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service == 'frontend' && 'frontend/Dockerfile' || format('services/{0}/Dockerfile', matrix.service) }}
          push: false
          tags: commerce/${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
