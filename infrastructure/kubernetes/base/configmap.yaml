apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-config
data:
  AUTH_JWT_ISSUER: commerce-auth-service
  GATEWAY_CORS_ALLOWED_ORIGINS: http://localhost:3000
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  OTEL_SDK_DISABLED: "true"
  JAVA_TOOL_OPTIONS: -Xmx256m -XX:MaxRAMPercentage=75.0 -Xss512k
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  AUTH_SERVICE_URL: http://auth-service:8081
  USER_SERVICE_URL: http://user-service:8082
  PRODUCT_SERVICE_URL: http://product-service:8083
  INVENTORY_SERVICE_URL: http://inventory-service:8084
  CART_SERVICE_URL: http://cart-service:8085
  ORDER_SERVICE_URL: http://order-service:8086
  PAYMENT_SERVICE_URL: http://payment-service:8087
  CHECKOUT_SERVICE_URL: http://checkout-service:8088
  NOTIFICATION_SERVICE_URL: http://notification-service:8089
  SEARCH_SERVICE_URL: http://search-service:8090
  RECOMMENDATION_SERVICE_URL: http://recommendation-service:8091
  AUTH_DB_URL: jdbc:postgresql://postgres:5432/auth_db
  AUTH_DB_USERNAME: auth_user
  USER_DB_URL: jdbc:postgresql://postgres:5432/user_db
  USER_DB_USERNAME: user_user
  PRODUCT_DB_URL: jdbc:postgresql://postgres:5432/product_db
  PRODUCT_DB_USERNAME: product_user
  INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/inventory_db
  INVENTORY_DB_USERNAME: inventory_user
  CART_DB_URL: jdbc:postgresql://postgres:5432/cart_db
  CART_DB_USERNAME: cart_user
  ORDER_DB_URL: jdbc:postgresql://postgres:5432/order_db
  ORDER_DB_USERNAME: order_user
  PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/payment_db
  PAYMENT_DB_USERNAME: payment_user
  NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification_db
  NOTIFICATION_DB_USERNAME: notification_user
  SEARCH_DB_URL: jdbc:postgresql://postgres:5432/search_db
  SEARCH_DB_USERNAME: search_user
  RECOMMENDATION_DB_URL: jdbc:postgresql://postgres:5432/recommendation_db
  RECOMMENDATION_DB_USERNAME: recommendation_user

