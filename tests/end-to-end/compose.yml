services:
  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    environment:
      AUTH_DB_URL: jdbc:postgresql://auth-db:5432/auth_db
      AUTH_DB_USERNAME: auth_user
      AUTH_DB_PASSWORD: auth_password
      AUTH_SERVER_PORT: 8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/actuator/health)\" = 200"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      auth-db:
        condition: service_healthy

  user-db:
