spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${PAYMENT_DB_USERNAME:payment_user}
    password: ${PAYMENT_DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    template:
      # Producer spans + W3C traceparent injection via Micrometer/OpenTelemetry.
      observation-enabled: true
server:
  port: ${PAYMENT_SERVER_PORT:8087}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: payment-service
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://tempo:4318/v1/traces}

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-}]"

payment:
  outbox:
    enabled: ${PAYMENT_OUTBOX_ENABLED:true}
    poll-interval: ${PAYMENT_OUTBOX_POLL_INTERVAL:1s}
    batch-size: ${PAYMENT_OUTBOX_BATCH_SIZE:20}
    send-timeout: ${PAYMENT_OUTBOX_SEND_TIMEOUT:15s}
    initial-backoff: ${PAYMENT_OUTBOX_INITIAL_BACKOFF:1s}
    max-backoff: ${PAYMENT_OUTBOX_MAX_BACKOFF:5m}
