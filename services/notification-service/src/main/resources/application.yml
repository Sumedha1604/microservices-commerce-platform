spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${NOTIFICATION_DB_USERNAME:notification_user}
    password: ${NOTIFICATION_DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      # Its own group: order-service keeps its offsets on payment.events.v1 untouched.
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      # Offsets advance only after the handler (and its DB transaction) succeeds.
      ack-mode: RECORD
      # Matches the 3 partitions of payment.events.v1; never exceed the partition count.
      concurrency: 3
      # Consumer spans continuing the producer's W3C traceparent.
      observation-enabled: true
    producer:
      # Only used for dead-letter republishing; notification-service publishes no domain events.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        # With the broker down, a dead-letter send fails fast instead of holding the consumer
        # thread for the client's 60s/120s defaults; the record is then redelivered, not lost.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
server:
  port: ${NOTIFICATION_SERVER_PORT:8089}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: notification-service
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://tempo:4318/v1/traces}

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-}]"
