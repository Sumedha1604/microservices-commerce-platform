spring:
  application:
    name: checkout-service

server:
  port: ${CHECKOUT_SERVER_PORT:8088}

checkout:
  http:
    connect-timeout: ${CHECKOUT_HTTP_CONNECT_TIMEOUT:1s}
    read-timeout: ${CHECKOUT_HTTP_READ_TIMEOUT:2s}
  services:
    cart-url: ${CART_SERVICE_URL:http://localhost:8085}
    product-url: ${PRODUCT_SERVICE_URL:http://localhost:8083}
    inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8084}
    order-url: ${ORDER_SERVICE_URL:http://localhost:8086}
    payment-url: ${PAYMENT_SERVICE_URL:http://localhost:8087}

resilience4j:
  circuitbreaker:
    configs:
      checkout-default:
        sliding-window-type: count_based
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.sumedha.commerce.checkout.exception.DownstreamBadGatewayException
          - com.sumedha.commerce.checkout.exception.DownstreamUnavailableException
          - com.sumedha.commerce.checkout.exception.DownstreamTimeoutException
    instances:
      cartService:
        base-config: checkout-default
      productService:
        base-config: checkout-default
      inventoryService:
        base-config: checkout-default
      orderService:
        base-config: checkout-default
      paymentService:
        base-config: checkout-default
  retry:
    configs:
      checkout-read:
        max-attempts: 2
        wait-duration: 100ms
        retry-exceptions:
          - com.sumedha.commerce.checkout.exception.DownstreamBadGatewayException
          - com.sumedha.commerce.checkout.exception.DownstreamUnavailableException
          - com.sumedha.commerce.checkout.exception.DownstreamTimeoutException
    instances:
      cartService:
        base-config: checkout-read
      productService:
        base-config: checkout-read
      inventoryService:
        base-config: checkout-read

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: checkout-service
  endpoint:
    health:
      show-details: never
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://tempo:4318/v1/traces}

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-}]"
