spring:
  application:
    name: recommendation-service
  datasource:
    url: ${RECOMMENDATION_DB_URL:jdbc:postgresql://localhost:5432/recommendation_db}
    username: ${RECOMMENDATION_DB_USERNAME:recommendation_user}
    password: ${RECOMMENDATION_DB_PASSWORD:change-me}
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      # Its own group: search-service keeps its offsets on product.events.v1 untouched.
      group-id: recommendation-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # A new group replays every product event still retained on the topic - and only those.
      # See docs/decisions/0007-product-recommendations.md (bootstrap).
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      # Offsets advance only after the handler (and its DB transaction) succeeds.
      ack-mode: RECORD
      # Matches the 3 partitions of product.events.v1; never exceed the partition count.
      concurrency: 3
      # Consumer spans continuing the producer's W3C traceparent.
      observation-enabled: true
    producer:
      # Only used for dead-letter republishing; recommendation-service publishes no events.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
server:
  port: ${RECOMMENDATION_SERVER_PORT:8091}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: recommendation-service
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://tempo:4318/v1/traces}

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-}]"
