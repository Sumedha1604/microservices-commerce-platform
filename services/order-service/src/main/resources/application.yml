spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${ORDER_DB_USERNAME:order_user}
    password: ${ORDER_DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      # Offsets advance only after the handler (and its DB transaction) succeeds.
      ack-mode: RECORD
      # Matches the 3 partitions of payment.events.v1; never exceed the partition count.
      concurrency: 3
      # Consumer spans continuing the producer's W3C traceparent.
      observation-enabled: true
    producer:
      # Shared by dead-letter republishing and the compensation outbox publisher.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        # Bounded like payment-service's publisher: with the broker down, a send must fail fast
        # rather than hold the outbox row locks for the client's 60s/120s defaults.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    template:
      # Producer spans + W3C traceparent injection for the compensation publisher. The dead-letter
      # template ignores this and keeps observation off, to preserve the original record's headers.
      observation-enabled: true
order:
  dlt:
    # Consumer group for the DLT inspection listener. Deliberately separate from the business
    # group so capturing dead letters never interferes with payment-event consumption.
    consumer-group: ${ORDER_DLT_CONSUMER_GROUP:order-service-dlt}
    replay:
      send-timeout: ${ORDER_DLT_REPLAY_SEND_TIMEOUT:10s}
  outbox:
    # Compensation events (InventoryReleaseRequested) owed to order.compensation.v1.
    # Disable to hold the publisher still; pending rows stay durable either way.
    enabled: ${ORDER_OUTBOX_ENABLED:true}
    poll-interval: ${ORDER_OUTBOX_POLL_INTERVAL:1s}
    batch-size: ${ORDER_OUTBOX_BATCH_SIZE:20}
    send-timeout: ${ORDER_OUTBOX_SEND_TIMEOUT:15s}
    initial-backoff: ${ORDER_OUTBOX_INITIAL_BACKOFF:1s}
    max-backoff: ${ORDER_OUTBOX_MAX_BACKOFF:5m}

server:
  port: ${ORDER_SERVER_PORT:8086}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: order-service
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://tempo:4318/v1/traces}

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-}]"
