spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${ORDER_DB_USERNAME:order_user}
    password: ${ORDER_DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      # Offsets advance only after the handler (and its DB transaction) succeeds.
      ack-mode: RECORD
      # Matches the 3 partitions of payment.events.v1; never exceed the partition count.
      concurrency: 3
      # Consumer spans continuing the producer's W3C traceparent.
      observation-enabled: true
    producer:
      # Only used for dead-letter republishing.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
order:
  dlt:
    # Consumer group for the DLT inspection listener. Deliberately separate from the business
    # group so capturing dead letters never interferes with payment-event consumption.
    consumer-group: ${ORDER_DLT_CONSUMER_GROUP:order-service-dlt}
    replay:
      send-timeout: ${ORDER_DLT_REPLAY_SEND_TIMEOUT:10s}

server:
  port: ${ORDER_SERVER_PORT:8086}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: order-service
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://tempo:4318/v1/traces}

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-}]"
